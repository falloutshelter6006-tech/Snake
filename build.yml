name: Build SnakeGame IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Собрать без подписи
        run: |
          xcodebuild -project SnakeGame.xcodeproj -scheme SnakeGame \
            -configuration Release \
            -archivePath build/SnakeGame.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Собрать IPA
        run: |
          mkdir -p build/Payload
          cp -R build/SnakeGame.xcarchive/Products/Applications/SnakeGame.app build/Payload/
          cd build
          zip -r SnakeGame.ipa Payload

      - name: Отдать IPA
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-unsigned
          path: build/SnakeGame.ipa
          if-no-files-found: error
